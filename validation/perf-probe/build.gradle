plugins { id 'fabric-loom' version '1.13.6' }
group = 'com.cobbleraids.validation'
version = '1.0.0'
base { archivesName = 'worldboss-perf-probe' }
repositories { mavenCentral() }
loom { mixin { useLegacyMixinAp = true } }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    compileOnly 'org.graalvm.sdk:graal-sdk:22.3.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
test { useJUnitPlatform() }
