<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gem Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Gem Shop for Snobblemon Regions - WebGUI page. Static look on purpose: no infinite animations, no blend modes, no hover movement
   (WebGUI paints off-screen; constant repaints made earlier pages lag). The stage is designed at 2000x1125 and scaled to the window. */
/* Prismatic palette = the Gem's colours: pink -> magenta -> violet -> blue -> cyan. */
:root {
  --pink: #ff9af0; --mag: #d65aea; --purp: #8a44f5; --blue: #4c7cff; --cy: #3ddcff; --cyl: #b4f7ff;
  --prism: linear-gradient(115deg, #ff9af0 0%, #d65aea 20%, #8a44f5 42%, #4c7cff 62%, #3ddcff 82%, #b4f7ff 100%);
  --acc: #e08cf5; --acc-d: #8a44f5; --acc-l: #f6d2ff;
  --edge: #4a2a99; --edge-hi: #8a44f5;
  --fill-a: #1d1050; --fill-b: #100834;
  --txt: #d4c8ee; --dim: #8f82b8; --white: #fbf6ff;
  --gold: #ffd24a; --green: #3ee06b; --red: #ff5a6a;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #07041a; color: var(--txt);
  font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace; user-select: none; -webkit-user-select: none; }
/* the page paints its own backdrop: WebGUI draws black behind transparent pages */
#bg { position: fixed; inset: 0;
  background:
    linear-gradient(rgba(138,68,245,.10) 1px, transparent 1px) 0 0 / 48px 48px,
    linear-gradient(90deg, rgba(138,68,245,.10) 1px, transparent 1px) 0 0 / 48px 48px,
    radial-gradient(ellipse at 22% 20%, rgba(255,154,240,.16) 0%, rgba(255,154,240,0) 45%),
    radial-gradient(ellipse at 80% 78%, rgba(61,220,255,.14) 0%, rgba(61,220,255,0) 45%),
    radial-gradient(ellipse at 50% 35%, #2a1366 0%, #170a3c 45%, #07041a 100%); }
#zoom { position: fixed; right: 10px; bottom: 10px; z-index: 50; display: flex; align-items: center; gap: 4px; font: 14px/1 Consolas, monospace; color: #cbb8f5; }
#zoom b { width: 30px; height: 28px; display: flex; align-items: center; justify-content: center; border: 1px solid #6a3cc4; background: rgba(20,10,58,.9); cursor: pointer; font-size: 18px; }
#zoom b:hover { border-color: #e08cf5; color: #fff; }
#zoom span { min-width: 44px; text-align: center; }
#stage { position: absolute; left: 0; top: 0; width: 2000px; height: 1125px; transform-origin: 0 0; }
.abs { position: absolute; }
.pxt svg { display: block; }

/* cut-corner panels: outer = border colour, inner (::before) = fill, both clipped */
.cut { position: absolute; --c: 26px; background: linear-gradient(125deg, #b04aa8 0%, #6a3cc4 38%, #3a6fd8 72%, #2aa6c4 100%);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--c)), calc(100% - var(--c)) 100%, 0 100%); }
.cut::before { content: ''; position: absolute; inset: 1px; background: linear-gradient(180deg, var(--fill-a), var(--fill-b));
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - var(--c) - 1px), calc(100% - var(--c) - 1px) 100%, 0 100%); }
.cut > * { position: absolute; }
.tick1 { left: 24px; top: 0; width: 14px; height: 2px; background: var(--acc-d); }
.tick2 { left: 0; top: 24px; width: 2px; height: 9px; background: var(--acc-d); }

#frame { left: 60px; top: 45px; width: 1882px; height: 1060px; border: 1px solid #3a2380; background: linear-gradient(180deg, rgba(26,10,70,.55), rgba(12,5,36,.55)); }
#title { left: 120px; top: 108px; }
#sub { left: 520px; top: 122px; font-size: 20px; letter-spacing: 5px; color: #a698d0; white-space: nowrap; }
#subline { left: 800px; top: 133px; width: 700px; height: 2px; background: var(--prism); background-size: 300% 100%; opacity: .85; }
#chip { left: 1490px; top: 104px; width: 395px; height: 62px; --c: 20px; }
#chip .gemimg { left: 22px; top: 11px; width: 40px; height: 40px; image-rendering: pixelated; }
#chip .num { left: 76px; top: 16px; }
#chip .unit { right: 34px; top: 24px; }

#left { left: 118px; top: 219px; width: 450px; height: 827px; }
.h2 { position: absolute; left: 34px; }
.row { position: absolute; left: 34px; width: 383px; height: 56px; border-bottom: 1px dashed #3a2380; display: flex; align-items: center; justify-content: space-between; font-size: 23px; color: var(--txt); }
.row .v { color: var(--white); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.cat { position: absolute; left: 24px; width: 402px; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px;
  font-size: 23px; color: var(--txt); border: 1px solid transparent; cursor: pointer; transition: background .12s, border-color .12s, color .12s; }
.cat:hover { border-color: #6a3cc4; background: rgba(224,140,245,.05); color: var(--white); }
.cat.on { border-color: var(--acc-d); background: rgba(224,140,245,.10); color: var(--acc-l); }
.cat .n { font-size: 20px; color: var(--dim); }
.cat.on .n { color: var(--acc); }
.cat .dot { display: inline-block; width: 9px; height: 9px; margin-right: 12px; background: #4a2a99; }
.cat.on .dot { background: var(--acc); }

#tip { left: 34px; top: 748px; width: 380px; font-size: 17px; line-height: 24px; color: #8f82b8; }
#right { left: 625px; top: 219px; width: 1260px; height: 666px; }
#beam { left: 520px; top: 1px; width: 220px; height: 560px; pointer-events: none;
  background: radial-gradient(ellipse 50% 100% at 50% 0%, rgba(224,140,245,.16), rgba(224,140,245,0) 75%); }
#floor { left: 330px; top: 520px; width: 600px; height: 70px; pointer-events: none;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(224,140,245,.18), rgba(224,140,245,0) 75%); }
#catname { left: 36px; top: 26px; }
#catdesc { left: 36px; top: 64px; font-size: 18px; color: var(--dim); white-space: nowrap; }
.stab { display: inline-block; margin-right: 10px; padding: 3px 14px; border: 1px solid #4a2a99; color: var(--dim); cursor: pointer; font-size: 17px; }
.stab i { font-style: normal; color: var(--dim); margin-left: 6px; }
.stab:hover { border-color: #6a3cc4; color: var(--white); }
.stab.on { border-color: var(--acc-d); background: rgba(224,140,245,.12); color: var(--acc-l); }
#catdesc { pointer-events: auto; }
#pager { right: 32px; top: 24px; display: flex; align-items: center; gap: 14px; }
.pgb { width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #6a3cc4; color: var(--acc); font-size: 24px; cursor: pointer; background: rgba(224,140,245,.04); transition: background .12s, border-color .12s; }
.pgb:hover { background: rgba(224,140,245,.14); border-color: var(--acc); }
.pgb.off { opacity: .3; cursor: default; pointer-events: none; }
#pgtxt { min-width: 80px; display: flex; justify-content: center; }

#grid { left: 91px; top: 108px; width: 1078px; height: 418px; }
.card { position: absolute; width: 198px; height: 198px; --c: 18px; cursor: pointer; }
.card::before { background: linear-gradient(180deg, #261263, #140a3a); transition: background .12s; }
.card.hover, .card:hover { background: var(--prism); }
.card:hover::before { background: linear-gradient(180deg, #341b80, #1c0e4c); }
.card.sel { background: var(--prism); background-size: 300% 300%; }
.card.sel::before { background: linear-gradient(180deg, #2c1a58, #160d3c); }
.card .tk { left: 18px; top: 0; width: 12px; height: 2px; background: var(--acc); }
.card.sel .tk { background: #fff; }
.card .qty { right: 14px; top: 10px; font-size: 22px; font-weight: 700; color: var(--white); }
.card .ico { left: 67px; top: 36px; width: 64px; height: 64px; image-rendering: pixelated; }
.card .tile { left: 67px; top: 36px; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; background: #2a1670; border: 1px solid #6a3cc4; color: var(--acc-l); font-size: 28px; }
.card .nm { left: 8px; right: 8px; top: 112px; height: 46px; text-align: center; font-size: 17px; line-height: 21px; color: #d4c8ee; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .pr { left: 0; right: 0; top: 160px; height: 26px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.card .pr img { width: 22px; height: 22px; image-rendering: pixelated; }
.card.no { opacity: .5; }
.card.no .pr { opacity: .9; }
.card .why { left: 8px; right: 8px; top: 8px; font-size: 14px; color: var(--red); text-align: left; max-width: 110px; line-height: 16px; }
.card .star { left: 14px; top: 40px; font-size: 20px; color: var(--gold); }

#detail { left: 36px; top: 544px; width: 1188px; height: 100px; }
#detail > * { position: absolute; }
#dname { left: 0; top: 6px; font-size: 28px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; color: var(--white); }
#ddesc { left: 0; top: 52px; width: 800px; font-size: 18px; line-height: 24px; color: var(--txt); }
#dprice { right: 280px; top: 14px; display: flex; align-items: center; gap: 12px; }
#dprice img { width: 34px; height: 34px; image-rendering: pixelated; }
#dlim { right: 280px; top: 62px; font-size: 17px; color: var(--dim); text-align: right; }
#hint { left: 0; top: 36px; }
#dtm { right: 280px; top: 86px; font-size: 16px; font-weight: 700; color: #f6d2ff; text-align: right; display: none; }
.btn { position: absolute; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--prism); background-size: 300% 100%;
  clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); transition: background .12s; }
.btn:hover { filter: brightness(1.16); }
.btn.off { background: #2a1c5c; cursor: default; pointer-events: none; }
.btn.ghost { background: #4a2a99; }
.btn.ghost:hover { background: #6a3cc4; }
#buy { right: 0; top: 14px; width: 250px; height: 72px; }
#close { left: 973px; top: 927px; width: 564px; height: 120px; }

#empty { left: 0; right: 0; top: 170px; text-align: center; font-size: 22px; letter-spacing: 4px; color: var(--dim); }

/* modal */
#veil { position: absolute; left: 0; top: 0; width: 2000px; height: 1125px; background: rgba(8,3,26,.84); display: none; }
#veil.on { display: block; }
#modal { left: 620px; top: 250px; width: 760px; height: 560px; --c: 30px; }
#mt { left: 40px; top: 34px; }
#mico { left: 48px; top: 100px; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; border: 1px solid #6a3cc4; background: #190c46; }
#mico img { width: 80px; height: 80px; image-rendering: pixelated; }
#mname { left: 184px; top: 112px; font-size: 28px; font-weight: 700; letter-spacing: 1px; color: var(--white); width: 540px; }
#mdesc { left: 184px; top: 156px; width: 540px; font-size: 17px; line-height: 22px; color: var(--dim); height: 70px; overflow: hidden; }
.mrow { position: absolute; left: 40px; width: 680px; height: 52px; border-bottom: 1px dashed #3a2380; display: flex; align-items: center; justify-content: space-between; font-size: 22px; }
.mrow .v img { width: 40px; height: 40px; image-rendering: pixelated; }
.mrow .v { display: flex; align-items: center; gap: 8px; color: var(--white); font-weight: 700; }
#mok { left: 40px; top: 462px; width: 320px; height: 70px; }
#mcancel { left: 400px; top: 462px; width: 320px; height: 70px; }
#mexp { left: 40px; top: 408px; font-size: 15px; color: var(--dim); }

/* toast */
#toast { left: 600px; top: 52px; width: 800px; height: 56px; display: none; align-items: center; justify-content: center; font-size: 21px; letter-spacing: 1px; --c: 14px; }
#toast.on { display: flex; }
#toast .tx { position: relative; z-index: 2; left: 0; }
#toast.ok { background: var(--green); }
#toast.ok::before { background: #0b3a27; }
#toast.ok .tx { color: #b5ffcc; }
#toast.bad { background: var(--red); }
#toast.bad::before { background: #3d1620; }
#toast.bad .tx { color: #ffc2c9; }
#live { left: 1884px; top: 130px; width: 12px; height: 12px; background: #3a5566; }
#live.on { background: var(--green); }

/* ---- offer timer pill (only when the server has timers switched on) */
.card .tm { left: 8px; top: 8px; height: 22px; padding: 0 8px; display: flex; align-items: center; font-size: 14px; font-weight: 700; letter-spacing: .5px;
  color: #1a0a40; background: linear-gradient(90deg, #ff9af0, #b4f7ff); clip-path: polygon(0 0, 100% 0, 100% 100%, 6px 100%, 0 calc(100% - 6px)); }
.card .tm.low { background: linear-gradient(90deg, #ffb36b, #ff5a6a); }
.card .tm.gone { background: #3b2a66; color: #a698d0; }

/* ---- animations. Everything is one-shot except the optional idle shimmer (config gui.animations = FULL); body.fx-off switches all of it off. */
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes popin { 0% { opacity: 0; transform: scale(.86); } 70% { opacity: 1; transform: scale(1.03); } 100% { opacity: 1; transform: none; } }
@keyframes shimmer { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
@keyframes twinkle { 0% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.4); } }
@keyframes bannerPop { 0% { opacity: 0; transform: scale(.5); } 14% { opacity: 1; transform: scale(1.12); } 24% { transform: scale(1); } 78% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-26px) scale(1.04); } }
@keyframes chipflash { 0% { filter: brightness(1); } 25% { filter: brightness(1.9) saturate(1.4); } 100% { filter: brightness(1); } }
@keyframes toastin { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
body:not(.fx-off) #left { animation: rise .55s both; }
body:not(.fx-off) #right { animation: rise .55s .09s both; }
body:not(.fx-off) #chip { animation: rise .55s .05s both; }
body:not(.fx-off) #close { animation: rise .55s .18s both; }
body:not(.fx-off) #grid.pop { animation: rise .4s both; }
body:not(.fx-off) #modal { animation: popin .26s both; }
body:not(.fx-off) #toast.on { animation: toastin .25s both; }
body:not(.fx-off) #chip.flash { animation: chipflash .9s; }
body.fx-full #subline, body.fx-full .card.sel, body.fx-full #buy:not(.off), body.fx-full #close { animation-name: shimmer; animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: steps(24); animation-direction: alternate; }
body.fx-full #close { animation-name: shimmer !important; }
.sp { position: absolute; width: 22px; height: 22px; background: #fff; opacity: 0; pointer-events: none;
  clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%); }
body.fx-full .sp { animation: twinkle 3.6s steps(6) infinite; }
#fx { position: absolute; left: 0; top: 0; width: 2000px; height: 1125px; pointer-events: none; }
#banner { left: 400px; top: 380px; width: 1200px; height: 260px; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(10,4,34,.88), rgba(10,4,34,0) 100%); display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; gap: 14px; }
#banner.on { display: flex; animation: bannerPop 1.9s both; }
#banner .bn { font-size: 26px; font-weight: 700; letter-spacing: 2px; color: var(--white); text-shadow: 0 0 12px rgba(214,90,234,.9); }
#mockbar { position: fixed; left: 8px; bottom: 6px; font-size: 12px; color: #6a8; display: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="zoom"><b id="zout" title="Zoom out">-</b><span id="zpct"></span><b id="zin" title="Zoom in">+</b></div>
<div id="stage">
  <div id="frame" class="abs"></div>
  <div class="sp" style="left:440px;top:100px;animation-delay:.2s;background:#ff9af0"></div><div class="sp" style="left:1440px;top:96px;animation-delay:1.4s;background:#3ddcff"></div><div class="sp" style="left:1010px;top:214px;width:16px;height:16px;animation-delay:2.2s;background:#d65aea"></div><div class="sp" style="left:1880px;top:200px;width:18px;height:18px;animation-delay:.9s;background:#b4f7ff"></div>
  <div id="title" class="abs pxt"></div>
  <div id="sub" class="abs">/ SNOBBLEMON REGIONS</div>
  <div id="subline" class="abs"></div>
  <div id="chip" class="cut"><div class="tick1"></div><div class="tick2"></div>
    <img class="gemimg" id="chipgem" alt=""><div class="num" id="chipnum"></div><div class="unit pxt" id="chipunit"></div></div>

  <div id="left" class="cut"><div class="tick1"></div><div class="tick2"></div>
    <div class="h2 pxt" id="hyour" style="top:38px"></div>
    <div id="lrows"></div>
    <div class="h2 pxt" id="cathead" style="top:318px"></div>
    <div id="cats"></div>
    <div id="tip"></div>
  </div>

  <div id="right" class="cut"><div class="tick1"></div><div class="tick2"></div>
    <div id="beam"></div><div id="floor"></div>
    <div id="catname" class="pxt"></div><div id="catdesc"></div>
    <div id="pager"><div class="pgb" id="pgprev">&#9664;</div><div id="pgtxt" class="pxt"></div><div class="pgb" id="pgnext">&#9654;</div></div>
    <div id="grid"></div>
    <div id="empty"></div>
    <div id="detail">
      <div id="hint" class="pxt"></div>
      <div id="dname"></div><div id="ddesc"></div>
      <div id="dprice"></div><div id="dlim"></div><div id="dtm"></div>
      <div id="buy" class="btn pxt"></div>
    </div>
  </div>

  <div id="close" class="btn pxt"></div>
  <canvas id="fx" width="1000" height="563"></canvas>
  <div id="banner" class="abs"><div id="bnt" class="pxt"></div><div class="bn" id="bnn"></div></div>
  <div id="toast" class="cut"><div class="tx" id="toasttx"></div></div>

  <div id="veil"><div id="modal" class="cut"><div class="tick1"></div><div class="tick2"></div>
    <div id="mt" class="pxt"></div>
    <div id="mico"></div><div id="mname"></div><div id="mdesc"></div>
    <div id="mrows"></div><div id="mexp"></div>
    <div id="mok" class="btn pxt"></div><div id="mcancel" class="btn ghost pxt"></div>
  </div></div>
</div>
<div id="mockbar">MOCK DATA (plain browser preview) - not connected to a server</div>

<script>
(function () {
'use strict';
var ART = { gem: 'data:image/png;base64,__GEM64__', ticket: 'data:image/png;base64,__TICKET64__', skin: 'data:image/png;base64,__SKIN64__' };
var MOCKICONS = /*__MOCKICONS__*/{};
window.webgui = window.webgui || {};
var W = window.webgui;
var inMod = typeof window.cefQuery === 'function' || typeof W.assetsBase === 'string' || typeof W.isHud === 'boolean';
var mock = !inMod;
if (mock) {
  W.postToGame = W.postToGame || function (p) { mockServer(p); };
  W.closeGui = W.closeGui || function () { console.log('[mock] closeGui'); };
  W.on = W.on || function (n, f) { window.addEventListener('webgui:' + n, function (e) { f(e.detail); }); };
  document.getElementById('mockbar').style.display = 'block';
}
var $ = function (id) { return document.getElementById(id); };
// Only a real change touches the DOM (writing identical markup would repaint and can swallow a click between mouse-down and mouse-up).
['lrows', 'cats', 'grid', 'chipnum', 'dprice', 'mrows', 'mico'].forEach(function (id) {
  var el = $(id), d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML'), last = null;
  Object.defineProperty(el, 'innerHTML', { configurable: true, get: function () { return d.get.call(el); }, set: function (v) { v = String(v); if (v === last) return; last = v; d.set.call(el, v); } });
});
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
// Minecraft's dark colours (dark purple, dark blue ...) are unreadable on the dark panels: blend them toward white until they are legible
function lift(c) {
  if (!c || c.charAt(0) !== '#' || c.length !== 7) return '';
  var r = parseInt(c.substr(1, 2), 16), g = parseInt(c.substr(3, 2), 16), b = parseInt(c.substr(5, 2), 16), l = .3 * r + .59 * g + .11 * b;
  if (l >= 150) return c;
  var t = (150 - l) / (255 - l); r = Math.round(r + (255 - r) * t); g = Math.round(g + (255 - g) * t); b = Math.round(b + (255 - b) * t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function num(n) { return Number(n || 0).toLocaleString('en-US'); }

// ---------------------------------------------------------------- scaling: the 2000x1125 stage fits any window size / GUI scale
var ZOOM = 0.8;
try { var zs = parseFloat(localStorage.getItem('snobble_zoom')); if (zs >= 0.5 && zs <= 1) ZOOM = zs; } catch (e) {}
function fit() {
  var vw = window.innerWidth, vh = window.innerHeight, s = Math.min(vw / 2000, vh / 1125) * ZOOM;
  $('stage').style.transform = 'translate(' + Math.round((vw - 2000 * s) / 2) + 'px,' + Math.round((vh - 1125 * s) / 2) + 'px) scale(' + s + ')';
  var z = document.getElementById('zpct'); if (z) z.textContent = Math.round(ZOOM * 100) + '%';
}
function setZoom(d) { ZOOM = Math.max(0.5, Math.min(1, Math.round((ZOOM + d) * 10) / 10)); try { localStorage.setItem('snobble_zoom', String(ZOOM)); } catch (e) {} fit(); }
document.getElementById('zin').addEventListener('click', function () { setZoom(0.1); });
document.getElementById('zout').addEventListener('click', function () { setZoom(-0.1); });
window.addEventListener('resize', fit); fit();

  render();
  send({ kind: 'hello' });
  setInterval(function () { send({ kind: S.live ? 'ping' : 'hello' }); }, 4000);
  window.addEventListener('pagehide', function () { send({ kind: 'bye' }); });
}

// ---------------------------------------------------------------- mock server (plain browser preview only; never used in the game)
function mockServer(p) {
  function emit(n, o) { setTimeout(function () { window.dispatchEvent(new CustomEvent('webgui:' + n, { detail: o })); }, 0); }
  if (p.kind === 'quote') {
    var pr = MOCK.products.filter(function (x) { return x.id === p.product; })[0];
    if (!pr || MOCK.balance < pr.price) { emit('shop_quote', { ok: false, message: 'Not enough ' + MOCK.currency + '.' }); return; }
    emit('shop_quote', { ok: true, product: pr.id, token: 'mock', name: pr.name, color: pr.color, price: pr.price, balance: MOCK.balance, after: MOCK.balance - pr.price, seconds: 30 });
  } else if (p.kind === 'confirm') {
    var q = S.quote || MOCK.lastQuote;
    var pp = MOCK.products.filter(function (x) { return x.id === (MOCK.lastQuoteProduct); })[0];
    if (pp && MOCK.balance >= pp.price) { MOCK.balance -= pp.price; emit('shop_result', { ok: true, product: pp.id, message: pp.name + ' purchased for ' + num(pp.price) + ' ' + MOCK.currency + '.', balance: MOCK.balance }); setTimeout(pushMock, 30); }
  }
  if (p.kind === 'quote') MOCK.lastQuoteProduct = p.product;
}
var MOCK = null;
function pushMock() {
  MOCK.products.forEach(function (p) { p.ok = MOCK.balance >= p.price; p.reason = p.ok ? '' : 'Not enough ' + MOCK.currency; p.code = p.ok ? '' : 'funds'; });
  window.dispatchEvent(new CustomEvent('webgui:shop_state', { detail: { v: 2, seq: ++MOCK.seq, chunk: 0, chunks: 1, now: Date.now(), anim: (location.hash.indexOf('full') >= 0 ? 'FULL' : 'PURCHASE'), timers: true, player: 'Preview', currency: MOCK.currency, balance: MOCK.balance, earnedToday: 42, rev: 1, title: 'Gem Shop', cats: MOCK.cats, products: MOCK.products } }));
}
if (mock) {
  var h = (location.hash || '').replace('#', '').split(',');
  var bal = parseInt(h[0], 10); if (isNaN(bal)) bal = 12450;
  var P = function (id, name, color, icon, price, count, cats, desc, extra) { var o = { id: id, name: name, color: color, icon: icon, price: price, count: count, cats: cats, desc: desc, ok: true, reason: '', code: '', limit: '', featured: false }; for (var k in (extra || {})) o[k] = extra[k]; return o; };
  MOCK = { balance: bal, currency: 'Gems', seq: 0,
    cats: [{ id: 'featured', name: 'Featured Items', color: '', desc: ['Hand-picked deals.'], count: 5 }, { id: 'shiny', name: 'Shiny Boosts', color: '', desc: ['Shiny Boost Tickets.'], count: 3 },
           { id: 'skins', name: 'Pokemon Skins', color: '', desc: ['Cosmetic skins for your Pokemon.'], count: 3 }, { id: 'sneelz:cosmetics', name: "Sneelz' Cosmetics", color: '', desc: ['Cosmetics.'], count: 3 }, { id: 'sneelz:hats', parent: 'sneelz:cosmetics', name: 'Hats', color: '', desc: [''], count: 2 }, { id: 'sneelz:back', parent: 'sneelz:cosmetics', name: 'Back', color: '', desc: [''], count: 1 },
           { id: 'rare', name: 'Rare Items', color: '', desc: ['Items that are hard to come by.'], count: 4 }, { id: 'event', name: 'Event Items', color: '', desc: ['Limited-time goodies.'], count: 2 }],
    products: [
      P('shiny_ticket_1', 'Shiny Boost Ticket', '#ff55ff', 'snobblegems:ticket', 250, 1, ['featured', 'shiny'], ['Right-click to start a server-wide shiny boost for everyone.', 'Each ticket is one use.'], { featured: true }),
      P('shiny_ticket_3', 'Shiny Boost Ticket x3', '#ff55ff', 'snobblegems:ticket', 675, 3, ['shiny'], ['Three tickets. A small saving.']),
      P('shiny_ticket_10', 'Shiny Boost Ticket x10', '#ff55ff', 'snobblegems:ticket', 2200, 10, ['shiny'], ['Ten tickets for a community event.']),
      P('rare_candy', 'Rare Candy x5', '#ff55ff', 'cobblemon:rare_candy', 300, 5, ['featured', 'rare'], ['Level a Pokemon up instantly.'], { featured: true }),
      P('master_ball', 'Master Ball', '#aa00aa', 'cobblemon:master_ball', 2500, 1, ['featured', 'rare'], ['Never fails.'], { featured: true, limit: '0/3 bought' }),
      P('ability_capsule', 'Ability Capsule', '#55ffff', 'cobblemon:ability_capsule', 400, 1, ['rare'], ['Switch a Pokemon between its regular abilities.']),
      P('ability_patch', 'Ability Patch', '#ff55ff', 'cobblemon:ability_patch', 1200, 1, ['rare'], ['Unlocks a Hidden Ability.']),
      P('hat_a', 'Wizard Hat', '#ff55ff', 'minecraft:leather_helmet', 900, 1, ['sneelz:cosmetics', 'sneelz:hats'], ['A hat.']),
      P('hat_b', 'Top Hat', '#ff55ff', 'minecraft:leather_helmet', 700, 1, ['sneelz:cosmetics', 'sneelz:hats'], ['A hat.']),
      P('wing_a', 'Angel Wings', '#ff55ff', 'minecraft:elytra', 1500, 1, ['sneelz:cosmetics', 'sneelz:back'], ['Wings.']),
      P('fireworks', 'Firework Stack', '#55ff55', 'minecraft:firework_rocket', 120, 32, ['event'], ['Light up the spawn.'], { limit: '0/2 today' }),
      P('cake', 'Event Cake', '#ff55ff', 'minecraft:cake', 60, 1, ['event'], ['Limited-time treat.'], { ends: Date.now() + 5400000 }),
      P('skin_pikachu', 'Pikachu Skin', '#ff55ff', 'snobblegems:skin', 900, 1, ['skins'], ['A cosmetic skin for your Pikachu.', 'Open the skin menu to apply it.'], { limit: '0/1 bought' }),
      P('skin_charmander', 'Charmander Skin', '#ff55ff', 'snobblegems:skin', 900, 1, ['skins'], ['A cosmetic skin for your Charmander.'], { ends: Date.now() + 86400000 * 2 + 3600000 * 5 }),
      P('skin_bulbasaur', 'Bulbasaur Skin', '#ff55ff', 'snobblegems:skin', 1100, 1, ['skins'], ['A cosmetic skin for your Bulbasaur.'], { ends: Date.now() + 420000 }) ] };
  MOCK.cats[0].count = MOCK.products.filter(function (p) { return p.featured; }).length;
  if (h[1]) S.cat = h[1];
  if (h[2]) S.sel = h[2];
  render(); pushMock();
  if (h[3] === 'confirm' || h[3] === 'buy') setTimeout(function () { send({ kind: 'quote', product: S.sel }); }, 50);
  if (h[3] === 'buy') setTimeout(function () { $('mok').click(); }, 300);
  setFx();
}
})();
