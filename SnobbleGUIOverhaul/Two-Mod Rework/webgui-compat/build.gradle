plugins {
    id 'fabric-loom' version '1.16.3'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Snobblemon Server is a separate installed mod (named-mapping dev jar); compile against it, never bundle it.
    compileOnly files('../snobblemon-server/build/devlibs/SnobblemonServer-2.1.0-dev.jar')
}
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = "UTF-8" }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
