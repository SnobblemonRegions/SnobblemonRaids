<!DOCTYPE html>
<html lang="en">
<head><script src="/_inject.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snobblemon Regions Quests</title>
<style>
  :root {
    --shell: #c8202b; --shell-d: #8c1018; --shell-l: #ef4650;
    --screen: #0d2a2b; --screen-l: #164244; --screen-d: #07191a; --ink: #bff5d8; --dim: #5a9a86;
    --blue: #3ab4ff; --yellow: #ffd23a; --green: #3aff8c; --grey: #6b7b7b; --purple: #b98cff; --red: #ff5a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Consolas", "Courier New", monospace; color: var(--ink); user-select: none; }
  html { background: #0b1319; }
  /* The game draws this page without alpha blending, so anything see-through comes out black and the world cannot show through.
     Instead the page paints its own soft, dark, out-of-focus "scenery" (static, opaque). */
  body { background:
      radial-gradient(38% 34% at 16% 22%, #2f6b4c 0%, rgba(47,107,76,0) 100%),
      radial-gradient(34% 32% at 84% 26%, #2c5f8f 0%, rgba(44,95,143,0) 100%),
      radial-gradient(46% 30% at 50% 6%, #5d7f9a 0%, rgba(93,127,154,0) 100%),
      radial-gradient(60% 36% at 50% 104%, #1c3a2a 0%, rgba(28,58,42,0) 100%),
      radial-gradient(30% 26% at 82% 82%, #4a3a63 0%, rgba(74,58,99,0) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 24px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, rgba(255,255,255,0) 2px 24px),
      radial-gradient(120% 120% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%),
      linear-gradient(#27414f, #172a24); display: grid; place-items: center; }
  button { font: inherit; }

  .dex { width: 100vw; height: 100vh; flex: none; background: linear-gradient(160deg, var(--shell-l), var(--shell) 35%, var(--shell-d));
    border-radius: 0; padding: 14px; display: grid; grid-template-rows: 54px 1fr 40px; gap: 10px;
    box-shadow: inset 0 0 0 4px #4a0a0f, inset 0 6px 0 rgba(255,255,255,.3); }

  .top { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .lens { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #fff; flex: none;
    background: radial-gradient(circle at 35% 30%, #bfeaff, var(--blue) 45%, #0b5e9a);
    box-shadow: 0 0 14px var(--blue), inset 0 -4px 8px rgba(0,0,0,.4); }
  .led { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #4a0a0f; flex: none; }
  .led.r { background: #ff5a5a; box-shadow: 0 0 8px #ff5a5a; } .led.y { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); } .led.g { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .title { font-weight: 700; letter-spacing: .22em; color: #fff; text-shadow: 0 2px 0 var(--shell-d); font-size: 19px; white-space: nowrap; text-transform: uppercase; }
  .spacer { flex: 1; }
  .trainer { background: var(--screen); border: 3px solid #2a0508; border-radius: 8px; padding: 4px 12px; font-size: 13px; line-height: 1.3; white-space: nowrap; }
  .trainer b { color: #fff; }
  .btn { background: linear-gradient(#f4f4f4, #bdbdbd); border: 2px solid #4a0a0f; border-radius: 8px; color: #222; font-weight: 700; padding: 6px 12px; cursor: pointer; box-shadow: 0 3px 0 #4a0a0f; }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #4a0a0f; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.on { background: linear-gradient(#fff2a8, var(--yellow)); }
  .btn.go { background: linear-gradient(#b9ffd4, var(--green)); }
  .btn.sub { background: linear-gradient(#ffe9a0, var(--yellow)); }
  .btn.trk { background: linear-gradient(#c8e9ff, var(--blue)); }

  .body { display: grid; grid-template-columns: 236px minmax(0, 1fr) 370px; gap: 12px; min-height: 0; }
  .screen { position: relative; background: var(--screen); border-radius: 12px; border: 4px solid #2a0508; overflow: hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,.7); min-height: 0; }
  .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px); }
  .scroll { height: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--dim) transparent; }

  /* NAV */
  .nav { padding: 8px; display: flex; flex-direction: column; gap: 5px; }
  .nav h4 { margin: 8px 4px 2px; font-size: 11px; letter-spacing: .25em; color: var(--dim); font-weight: 400; }
  .tab { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; background: transparent; color: var(--ink); border: 1px solid transparent; border-radius: 8px; cursor: pointer; text-align: left; }
  .tab:hover { background: var(--screen-l); }
  .tab.on { background: var(--screen-l); border-color: var(--c, var(--yellow)); box-shadow: inset 3px 0 0 var(--c, var(--yellow)); }
  .tab img { width: 32px; height: 32px; object-fit: contain; image-rendering: pixelated; flex: none; }
  .tab img.flip { transform: scaleY(-1); }
  .tab .nm { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .ct { font-size: 12px; color: var(--dim); }
  .tab .ct b { color: var(--yellow); }
  .tab.lockd { opacity: .55; }

  /* LIST */
  .listwrap { display: flex; flex-direction: column; }
  .listhead { padding: 10px 14px 8px; border-bottom: 1px solid var(--screen-l); flex: none; }
  .listhead h2 { margin: 0; font-size: 17px; color: #fff; letter-spacing: .08em; }
  .listhead p { margin: 2px 0 0; font-size: 12px; color: var(--dim); line-height: 1.35; }
  .banner { margin: 10px 12px 0; padding: 8px 12px; border: 1px dashed var(--red); color: #ffb4b4; border-radius: 8px; font-size: 12px; }
  .grid { padding: 10px 12px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 9px; align-content: start; }
  .qc { position: relative; background: var(--screen-d); border: 2px solid var(--screen-l); border-radius: 10px; padding: 9px 10px 9px 10px; cursor: pointer; transition: border-color .15s; display: flex; flex-direction: column; gap: 5px; min-height: 92px; }
  .qc:hover { border-color: var(--dim); }
  .qc.sel { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.25), 0 0 14px rgba(191,245,216,.25); }
  .qc.s-locked { opacity: .55; } .qc.s-completed { opacity: .8; }
  .qc .row1 { display: flex; gap: 8px; align-items: center; }
  .glyph { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; font-size: 19px; flex: none; background: var(--g, #234); border: 2px solid rgba(255,255,255,.18); box-shadow: inset 0 -4px 6px rgba(0,0,0,.3); }
  .glyph img { width: 32px; height: 32px; image-rendering: pixelated; }
  .qc .nm { font-size: 14px; font-weight: 700; color: #fff; line-height: 1.2; flex: 1; min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .qc .sum { font-size: 12px; color: var(--dim); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .qc .foot { margin-top: auto; display: flex; align-items: center; gap: 6px; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #03201a; letter-spacing: .04em; white-space: nowrap; }
  .st-available { background: var(--blue); } .st-in_progress { background: var(--yellow); } .st-completed { background: var(--green); }
  .st-locked { background: var(--grey); color: #e5eded; } .st-cooldown { background: var(--purple); }
  .new { position: absolute; top: -7px; right: 8px; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 6px; letter-spacing: .08em; }
  .trkpin { color: var(--red); font-size: 12px; }
  .bar { height: 7px; background: #031211; border: 1px solid var(--dim); border-radius: 5px; overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width .4s; }
  .empty { padding: 40px 20px; text-align: center; color: var(--dim); }

  /* DETAIL */
  .detail { padding: 14px; font-size: 13.5px; line-height: 1.45; }
  .detail .hd { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .detail .glyph { width: 56px; height: 56px; font-size: 26px; }
  .detail .glyph img { width: 48px; height: 48px; }
  .detail h2 { margin: 0; font-size: 18px; color: #fff; line-height: 1.15; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .sec { margin: 12px 0 4px; font-size: 11px; letter-spacing: .25em; color: var(--dim); }
  .desc p { margin: 0 0 3px; }
  .obj { margin: 5px 0; }
  .obj .t { display: flex; justify-content: space-between; gap: 8px; }
  .obj .t span:last-child { color: var(--yellow); white-space: nowrap; }
  .obj.done .t span:last-child { color: var(--green); }
  .pre, .step { display: flex; align-items: center; gap: 8px; padding: 4px 8px; margin: 3px 0; border: 1px solid var(--screen-l); border-radius: 7px; background: var(--screen-d); cursor: pointer; }
  .pre:hover, .step:hover { border-color: var(--dim); }
  .pre .mk, .step .mk { width: 16px; text-align: center; flex: none; }
  .pre.ok .mk, .step.ok .mk { color: var(--green); } .pre.no .mk { color: var(--red); } .step.cur { border-color: var(--yellow); }
  .step .nm, .pre .nm { flex: 1; min-width: 0; }
  .step .btn { padding: 2px 8px; font-size: 11px; box-shadow: 0 2px 0 #4a0a0f; }
  .rew { display: flex; flex-wrap: wrap; gap: 5px; }
  .rew span { background: var(--screen-l); border: 1px solid var(--dim); border-radius: 6px; padding: 2px 8px; }
  .actions { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .actions .btn { flex: 1; min-width: 90px; }
  .note { margin-top: 8px; font-size: 11px; color: #ffb4b4; }
  .note.info { color: var(--dim); }
  .hint { color: var(--dim); font-size: 11px; margin-top: 6px; }

  /* BOTTOM */
  .bottom { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .dpad { width: 30px; height: 30px; background: #222; border-radius: 6px; flex: none;
    clip-path: polygon(33% 0, 66% 0, 66% 33%, 100% 33%, 100% 66%, 66% 66%, 66% 100%, 33% 100%, 33% 66%, 0 66%, 0 33%, 33% 33%); }
  .bottom input { flex: 1; min-width: 0; height: 100%; border-radius: 8px; border: 2px solid #4a0a0f; background: #0b1f20; color: var(--ink); font: inherit; padding: 0 12px; outline: none; }
  .bottom input:focus { border-color: var(--yellow); }
  .tracker { background: var(--screen); border: 3px solid #2a0508; border-radius: 8px; padding: 0 12px; height: 100%; display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; max-width: 42%; }
  .tracker .bar { width: 90px; flex: none; }
  .tracker .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }

  /* MOCK PANEL */
  .mock { position: fixed; right: 8px; bottom: 8px; z-index: 50; background: rgba(5,15,15,.92); border: 1px solid var(--dim); border-radius: 10px; padding: 8px 10px; font-size: 11px; width: 210px; }
  .mock summary { cursor: pointer; color: var(--yellow); }
  .mock label { display: block; margin: 3px 0; cursor: pointer; }
  .mock button { margin: 4px 4px 0 0; font-size: 11px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--dim); background: var(--screen-l); color: var(--ink); cursor: pointer; }
  .toast { position: fixed; left: 50%; top: 12px; transform: translate(-50%, -80px); background: var(--screen); border: 2px solid var(--green); color: #fff; padding: 8px 18px; border-radius: 10px; z-index: 60; transition: transform .35s; font-weight: 700; }
  .toast.show { transform: translate(-50%, 0); }
</style>
</head>

<div class="dex">
  <div class="top">

  <div class="bottom">

</div>

</details>

// ---------------------------------------------------------------------------
// Environment. In the mod, window.webgui + cefQuery exist. In a plain browser we mock both.
// ---------------------------------------------------------------------------
window.webgui = window.webgui || {};
var W = window.webgui;
// Inside the game WebGUI has already put `assetsBase` / `isHud` on window.webgui before any page script runs (and CEF's
// cefQuery with them); any one of them is proof. Anything else is a plain browser and gets the mock server.
var inMod = typeof window.cefQuery === 'function' || typeof W.assetsBase === 'string' || typeof W.isHud === 'boolean';
if (!inMod) {
  W.postToGame = W.postToGame || function (p) { console.log('[mock postToGame]', JSON.stringify(p)); };
  W.closeGui = W.closeGui || function () { console.log('[mock] closeGui'); };
  W.on = W.on || function (n, f) { window.addEventListener('webgui:' + n, function (e) { f(e.detail); }); };
}
var $ = function (id) { return document.getElementById(id); };
// The panels are rebuilt from scratch on every state push. Writing identical markup would still replace every element, which in the
// game's browser means a repaint for nothing and, worse, a button swapped out between mouse-down and mouse-up loses the click. So a
// write of the same markup is skipped; only a real change touches the page.
['nav', 'listHead', 'listBanner', 'grid', 'detail', 'tracker', 'trainer'].forEach(function (id) {
  var el = document.getElementById(id), set = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML').set, last = null;
  if (!el) return;
  Object.defineProperty(el, 'innerHTML', { configurable: true, get: function () { return Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML').get.call(el); },
    set: function (v) { v = String(v); if (v === last) return; last = v; set.call(el, v); } });
});
// The dex fills the whole window. Text is sized by a zoom factor that follows the window height (about 1.6x on a tall screen, smaller on
// a small one), and the dex is given the window size divided by that factor, so after zooming it covers the window exactly.
function fit() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var z = Math.max(.7, Math.min(1.7, vh / 780 * .92)), d = document.querySelector('.dex');
  d.style.zoom = z; d.style.width = (vw / z) + 'px'; d.style.height = (vh / z) + 'px';
}
window.addEventListener('resize', fit); fit();
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

// Catalogue (baked from config/simplequests by build.py)
// ---------------------------------------------------------------------------
var Q = DATA.quests, byId = {};
// The config hard-wraps descriptions at ~45 chars; rejoin them so the panel can wrap naturally.
Q.forEach(function (q) { byId[q.id] = q; if (q.desc.length) q.desc = [q.desc.join(' ')]; });
var CATS = {}; DATA.categories.forEach(function (c) { CATS[c.id] = c; });
var COLORS = { rootvale: '#4ade80', tideforge: '#3ab4ff', duskvale: '#b98cff', journey: '#ffd23a', tutorial: '#ff7a7a', daily: '#ffa94d', active: '#5ee6ff', completed: '#3aff8c' };
var VIRTUAL = {
  daily: { name: 'Daily Quests', desc: ['Reset every day. Complete them for steady Journey Points.'] },
  active: { name: 'In Progress', desc: ['Everything you have accepted right now.'] },
  completed: { name: 'Completed', desc: ['Finished quests and ones cooling down before they repeat.'] }
};
var BG = [['ball', null], ['apricorn', '#3b5d2e'], ['berry', '#5d2e3b'], ['candy', '#5d2e5d'], ['stone', '#4a4430'], ['fossil', '#4a4430']];
var BALLC = { poke: '#7a2a2a', great: '#243f7a', ultra: '#6b5a14', dusk: '#3d1a5a', moon: '#2a3278', dive: '#14606b', nest: '#3f5a22', net: '#1a5a50', quick: '#1a5878' };
// Quest icons are the real 16x16 item sprites (baked in by build.py), drawn at a whole multiple of their size with no smoothing.
function glyph(item) {
  var id = item.split(':')[1], bg = '#2a4a4a', src = DATA.itemIcons[item];
  if (id.indexOf('ball') !== -1) bg = BALLC[id.split('_')[0]] || '#444';
  else for (var i = 0; i < BG.length; i++) if (BG[i][1] && id.indexOf(BG[i][0]) !== -1) { bg = BG[i][1]; break; }
  return '<div class="glyph" style="--g:' + bg + '">' + (src ? '<img src="' + src + '" alt="">' : '◆') + '</div>';
}

// ---------------------------------------------------------------------------
// State. One shape for both worlds:
//   S.quests[id] = { st: 'in_progress'|'completed', prog: [n,…], cd: epochMs|0 }
// In-game it arrives as the `quest_state` event; in the mock it is simulated below.
// ---------------------------------------------------------------------------
var S = { trainer: 'Trainer', regions: inMod ? [] : ['rootvale'], tracked: null, quests: {}, counters: {}, done: {}, live: false };
var UI = { tab: 'tutorial', sel: null, query: '' };
var REGION_TABS = ['rootvale', 'tideforge', 'duskvale'];
// A region's quests are only for its members: a player outside a region never sees its tab, its quests, or them in search or lists.
function tabVisible(t) { return REGION_TABS.indexOf(t) === -1 || S.regions.indexOf(t) !== -1; }
function visible(q) { return regionOk(q) && tabVisible(q.cat); }

function leaf(q) { return q.kind === 'single'; }
function st(id) { return S.quests[id] || null; }
// Snobble Rules: until the Rules quest is complete the server refuses every other quest, so the page says so instead of letting a click do nothing.
var RULES_ID = DATA.rulesQuest || 'snobblemon:tutorial/00_rules';
var RULES_MSG = 'You must complete the Rules quest first before beginning!';
function rulesLocked() { var r = st(RULES_ID); return S.live && !!byId[RULES_ID] && !(r && r.st === 'completed'); }
function regionOk(q) { return q.region === 'general' || S.regions.indexOf(q.region) !== -1; }
function now() { return Date.now(); }

// A top-level quest's status. Sub-quests are shown inside their parent.
function status(q) {
  var s = st(q.id);
  if (s && s.st === 'in_progress') return 'in_progress';
  if (s && s.st === 'completed') {
    if (q.repeat.kind === 'once') return 'completed';
    if (s.cd > now()) return 'cooldown';
    // a repeatable quest whose cooldown is over is offered again (subject to the checks below)
  }
  if (!regionOk(q)) return 'locked';
  for (var i = 0; i < q.prereq.length; i++) { var p = st(q.prereq[i]); if (!p || p.st !== 'completed') return 'locked'; }
  return 'available';
}
function lockReason(q) {
  if (!regionOk(q)) return DATA.denied.split('%region%').join(cap(q.region));
  var miss = q.prereq.filter(function (id) { var p = st(id); return !p || p.st !== 'completed'; });
  return miss.length ? 'Finish the required quest first.' : '';
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

// Progress of an objective list → {done, total, ratio}
function progress(q) {
  var s = st(q.id);
  if (q.kind === 'sequential') {
    var d = q.subs.filter(function (id) { var x = st(id); return x && x.st === 'completed'; }).length;
    return { done: d, total: q.subs.length, ratio: d / q.subs.length };
  }
  if (q.kind === 'composite') {
    var act = q.subs.filter(function (id) { return st(id) && st(id).st === 'in_progress'; })[0];
    return act ? progress(byId[act]) : { done: 0, total: 1, ratio: 0 };
  }
  var done = 0, total = 0;
  q.objs.forEach(function (o, i) { total += o.amount; done += have(o, i, s); });
  if (s && s.st === 'completed') done = total;
  return { done: done, total: total || 1, ratio: total ? done / total : 0 };
}
function ready(q) {
  if (q.kind === 'sequential' || q.kind === 'composite') {
    var cur = currentSub(q); return cur ? ready(cur) : false;
  }
  var s = st(q.id); if (!s || s.st !== 'in_progress') return false;
  // Item hand-ins and the like cannot be counted from here (the server only knows at turn-in), so those never block the button.
  return q.objs.every(function (o, i) { return unknown(o, s) || have(o, i, s) >= o.amount; });
}
// How much of one objective is done. Datapack goals are counted by a scoreboard counter (or are simply done); other kinds report
// their own count in `tasks`; the mock server fills `prog` by position.
function have(o, i, s) {
  if (!s) return 0;
  if (s.st === 'completed') return o.amount;
  var h = s.prog && s.prog[i] ? s.prog[i] : 0;
  if (o.type === 'advancement') {
    if (o.advs && o.advs.some(function (a) { return S.done[a]; })) return o.amount;
    if (o.counter && typeof S.counters[o.counter] === 'number') h = Math.max(h, S.counters[o.counter]);
  } else if (s.tasks && s.tasks[o.key]) h = Math.max(h, s.tasks[o.key].have || 0);
  return Math.min(o.amount, h);
}
// True when the server cannot tell the page how far along this objective is.
function unknown(o, s) {
  if (!S.live || !s || s.st !== 'in_progress') return false;
  if (o.type === 'advancement') return false;
  var t = s.tasks && s.tasks[o.key];
  return !t || !t.text;
}
function currentSub(q) {
  if (q.kind === 'sequential') {
    var s = st(q.id); if (!s || s.st !== 'in_progress') return null;
    for (var i = 0; i < q.subs.length; i++) { var x = st(q.subs[i]); if (!x || x.st !== 'completed') return byId[q.subs[i]]; }
  }
  if (q.kind === 'composite') {
    var a = q.subs.filter(function (id) { return st(id) && st(id).st === 'in_progress'; })[0];
    return a ? byId[a] : null;
  }
  return null;
}
function activeCount(cat) {
  return Q.filter(function (q) { return !q.parent && visible(q) && q.cat === cat && status(q) === 'in_progress'; }).length;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
var TABS = DATA.menuOrder;
var SHORT = { journey: 'Journey', tutorial: 'Tutorial' };
var MENU = DATA.menu || {};   // card label / subtitle / view title from the config's custom journal GUI
function tabQuests(tab) {
  var top = Q.filter(function (q) { return !q.parent && visible(q); });
  var r;
  if (tab === 'daily') r = top.filter(function (q) { return q.repeat.kind === 'daily'; });
  else if (tab === 'active') r = top.filter(function (q) { return status(q) === 'in_progress'; });
  else if (tab === 'completed') r = top.filter(function (q) { var s = status(q); return s === 'completed' || s === 'cooldown'; });
  else r = top.filter(function (q) { return q.cat === tab; });
  return r.sort(function (a, b) { return a.sort - b.sort; });
}
function matchesQuery(q) {
  if (!UI.query) return true;
  var hay = [q.name, q.desc.join(' '), q.rewards.join(' '), q.objs.map(function (o) { return o.text; }).join(' '),
    q.subs.map(function (s) { return byId[s].name + ' ' + byId[s].objs.map(function (o) { return o.text; }).join(' '); }).join(' ')].join(' ').toLowerCase();
  return hay.indexOf(UI.query) !== -1;
}

// Tutorial first, then the player's own region(s), then Journey, then the personal lists.
var NAV = [['START HERE', ['tutorial']], ['REGIONS', REGION_TABS], ['TRAINER', ['journey']], ['TRACKING', ['daily', 'active', 'completed']]];
function renderNav() {
  var h = '';
  NAV.forEach(function (grp) {
    var tabs = grp[1].filter(function (t) { return TABS.indexOf(t) !== -1 && tabVisible(t); });
    if (!tabs.length) return;
    h += '<h4>' + grp[0] + '</h4>';
    tabs.forEach(function (t) {
      var c = CATS[t], mt = MENU[t] || {}, name = mt.label || SHORT[t] || (c ? c.name : VIRTUAL[t].name);
      var list = tabQuests(t);
      var avail = list.filter(function (q) { return status(q) === 'available'; }).length;
      var ct = t === 'active' || t === 'completed' ? '<b>' + list.length + '</b>' : '<b>' + avail + '</b>/' + list.length;
      // The source art for the In Progress ball is upside down (red half at the bottom); flip it.
      h += '<button class="tab' + (UI.tab === t ? ' on' : '') + '" data-tab="' + t + '" title="' + esc(mt.subtitle || '') + '" style="--c:' + COLORS[t] + '">' +
        '<img' + (t === 'active' ? ' class="flip"' : '') + ' src="' + DATA.icons[t] + '" alt=""><span class="nm">' + esc(name) + '</span><span class="ct">' + ct + '</span></button>';
    });
  });
  $('nav').innerHTML = h;
}

function chip(s, q) {
  var label = { available: 'AVAILABLE', in_progress: 'IN PROGRESS', completed: 'COMPLETED', locked: 'LOCKED', cooldown: 'COOLDOWN' }[s];
  if (s === 'cooldown') label = 'IN ' + fmtDur(st(q.id).cd - now());
  return '<span class="chip st-' + s + '">' + label + '</span>';
}
function fmtDur(ms) {
  var m = Math.max(1, Math.round(ms / 60000));
  if (m < 60) return m + 'M'; var h = Math.round(m / 60); return h < 48 ? h + 'H' : Math.round(h / 24) + 'D';
}

function renderList() {
  var c = CATS[UI.tab], vt = VIRTUAL[UI.tab];
  var name = (MENU[UI.tab] && MENU[UI.tab].title) || (c ? c.name : vt.name), desc = (c ? c.desc : vt.desc).join(' ');
  var hd = '<h2 style="color:' + COLORS[UI.tab] + '">' + esc(name) + '</h2><p>' + esc(desc) + '</p>';
  if (c) hd += '<p>Active slots: <b style="color:#fff">' + activeCount(UI.tab) + ' / ' + c.max + '</b></p>';
  $('listHead').innerHTML = hd;

  $('listBanner').innerHTML = rulesLocked() && UI.tab !== 'tutorial' ? '<div class="note" style="margin:0 0 8px">🔒 ' + esc(RULES_MSG) + ' Open <b>Tutorial</b> and press <b>Open the rules</b>.</div>' :
    (rulesLocked() ? '<div class="note" style="margin:0 0 8px">🔒 ' + esc(RULES_MSG) + '</div>' : '');

  // Searching looks across every quest, not just the open tab.
  var list = UI.query ? Q.filter(function (q) { return !q.parent && visible(q); }).sort(function (a, b) { return a.sort - b.sort; }) : tabQuests(UI.tab);
  list = list.filter(matchesQuery);
  if (!list.length) { $('grid').innerHTML = '<div class="empty">No quests here' + (UI.query ? ' match your search.' : ' yet.') + '</div>'; return; }

  $('grid').innerHTML = list.map(function (q) {
    var s = status(q), p = progress(q);
    var sum = q.desc[0] || (q.objs[0] ? q.objs[0].text : (q.kind === 'sequential' ? q.subs.length + '-step trial' : 'Choose one of ' + q.subs.length + ' deals'));
    var showBar = s === 'in_progress' || (s === 'completed') ;
    return '<div class="qc s-' + s + (UI.sel === q.id ? ' sel' : '') + '" data-q="' + q.id + '">' +
      (q.isNew ? '<span class="new">NEW</span>' : '') +
      '<div class="row1">' + glyph(q.icon) + '<div class="nm">' + esc(q.name) + '</div>' + (S.tracked === q.id ? '<span class="trkpin">◉</span>' : '') + '</div>' +
      '<div class="sum">' + esc(sum) + '</div>' +
      '<div class="foot">' + chip(s, q) + (showBar ? '<div class="bar"><i style="width:' + Math.round(p.ratio * 100) + '%"></i></div>' : '') +
      (UI.query ? '<span style="font-size:10px;color:var(--dim)">' + esc(CATS[q.cat].name) + '</span>' : '') + '</div></div>';
  }).join('');
}

function objHtml(q) {
  var s = st(q.id);
  return q.objs.map(function (o, i) {
    var v = have(o, i, s), u = unknown(o, s);
    var amt = u ? '?' : (o.amount > 1 ? v + ' / ' + o.amount : (v >= o.amount ? '✔' : '—'));
    return '<div class="obj' + (v >= o.amount ? ' done' : '') + '"><div class="t"><span>' + esc(o.text) + '</span><span>' + amt + '</span></div>' +
      '<div class="bar" style="width:100%"><i style="width:' + Math.round(v / o.amount * 100) + '%"></i></div></div>';
  }).join('');
}

function renderDetail() {
  var q = byId[UI.sel];
  if (!q) { $('detail').innerHTML = '<div class="empty">◉<br><br>Select a quest to read its entry.</div>'; return; }
  var s = status(q), c = CATS[q.cat];
  var h = '<div class="hd">' + glyph(q.icon) + '<div><h2>' + esc(q.name) + '</h2><div class="meta" style="color:' + COLORS[q.cat] + '">' + esc(c.name) + (q.region !== 'general' ? ' · ' + cap(q.region) + ' only' : '') + '</div></div></div>';
  h += chip(s, q) + ' <span class="meta">' + esc(q.repeat.label) + '</span>' + (q.kind !== 'single' ? ' <span class="meta">· ' + (q.kind === 'sequential' ? q.subs.length + ' steps, in order' : 'pick one') + '</span>' : '');

  if (q.desc.length) h += '<div class="sec">BRIEFING</div><div class="desc">' + q.desc.map(function (l) { return '<p>' + esc(l) + '</p>'; }).join('') + '</div>';

  if (q.kind === 'single') {
    h += '<div class="sec">OBJECTIVES</div>' + objHtml(q);
  } else {
    var cur = currentSub(q);
    h += '<div class="sec">' + (q.kind === 'sequential' ? 'STEPS' : 'DEALS — CHOOSE ONE') + '</div>';
    q.subs.forEach(function (id, i) {
      var sq = byId[id], x = st(id), done = x && x.st === 'completed', isCur = cur && cur.id === id;
      var line = sq.objs.map(function (o) { return o.text; }).join(' · ');
      var btn = '';
      if (q.kind === 'composite' && s === 'available' && !isCur) btn = '<button class="btn go" data-choose="' + id + '">Take</button>';
      h += '<div class="step' + (done ? ' ok' : '') + (isCur ? ' cur' : '') + '"><span class="mk">' + (done ? '✔' : (q.kind === 'sequential' ? (i + 1) : '○')) + '</span>' +
        '<div class="nm">' + esc(sq.name.replace(/^.*?:\s*/, '')) + '<div class="meta">' + esc(line) + '</div></div>' + btn + '</div>';
      if (isCur) h += '<div style="margin:2px 0 6px 24px">' + objHtml(sq) + '</div>';
    });
  }

  if (q.prereq.length) {
    var req = q.prereq.filter(function (id) { return visible(byId[id]); });
    if (req.length) h += '<div class="sec">REQUIRES</div>';
    req.forEach(function (id) {
      var p = byId[id], ok = st(id) && st(id).st === 'completed';
      h += '<div class="pre ' + (ok ? 'ok' : 'no') + '" data-goto="' + id + '"><span class="mk">' + (ok ? '✔' : '✖') + '</span><span class="nm">' + esc(p.name) + '</span><span class="meta">' + esc(CATS[p.cat].name) + '</span></div>';
    });
  }

  h += '<div class="sec">REWARDS</div><div class="rew">' + (q.rewards.length ? q.rewards.map(function (r) { return '<span>' + esc(r) + '</span>'; }).join('') : '<span>—</span>') + '</div>';

  // actions
  var acts = '', note = '';
  var full = c && activeCount(q.cat) >= c.max;
  if (s === 'available') {
    if (q.kind === 'composite') note = '<div class="note info">Choose one of the deals above to start.</div>';
    else if (q.id === RULES_ID) acts += '<button class="btn go" data-act="rules">Open the rules</button><button class="btn" data-act="accept"' + (full ? ' disabled' : '') + '>Accept</button>';
    else acts += '<button class="btn go" data-act="accept"' + (full || rulesLocked() ? ' disabled' : '') + '>Accept</button>';
    if (rulesLocked() && q.id !== RULES_ID) note = '<div class="note">🔒 ' + esc(RULES_MSG) + '</div>';
    else if (full) note = '<div class="note">' + esc(c.name) + ' already has ' + c.max + ' active quests. Finish or turn one in first.</div>';
  }
  if (s === 'in_progress') {
    if (q.id === RULES_ID) acts += '<button class="btn go" data-act="rules">Open the rules</button>';
    acts += '<button class="btn sub" data-act="submit"' + (ready(q) ? '' : ' disabled') + '>Turn in</button>';
    acts += '<button class="btn trk" data-act="track">' + (S.tracked === q.id ? '◉ Tracking' : '○ Track') + '</button>';
    if (q.id === RULES_ID) note = '<div class="note info">Read every page of the rules, then press “I have read the rules”. This quest finishes by itself.</div>';
    else if (!ready(q)) note = '<div class="note info">Finish every objective, then turn it in.</div>';
  }
  if (s === 'locked') note = '<div class="note">🔒 ' + esc(lockReason(q)) + '</div>';
  if (s === 'cooldown') note = '<div class="note info">Available again in ' + fmtDur(st(q.id).cd - now()).toLowerCase() + '.</div>';
  h += '<div class="actions">' + acts + '</div>' + note;
  if (inMod === false) h += '<div class="hint">Mock: ' + esc(q.id) + '</div>';
  $('detail').innerHTML = h;
}

function renderTracker() {
  var q = S.tracked && byId[S.tracked];
  if (!q || status(q) !== 'in_progress') { $('tracker').innerHTML = '<span style="color:var(--dim)">No quest tracked</span>'; return; }
  var sub = currentSub(q) || q, p = progress(sub);
  $('tracker').innerHTML = '<span class="trkpin">◉</span><span class="tn">' + esc(q.name) + '</span><div class="bar"><i style="width:' + Math.round(p.ratio * 100) + '%"></i></div><span>' + p.done + '/' + p.total + '</span>';
}
function renderTrainer() {
  var done = Q.filter(function (q) { return !q.parent && visible(q) && st(q.id) && st(q.id).st === 'completed'; }).length;
  var top = Q.filter(function (q) { return !q.parent && visible(q); }).length;
  $('trainer').innerHTML = '<b>' + esc(S.trainer) + '</b><br>' + done + ' / ' + top + ' quests · ' + S.regions.map(cap).join(', ') + (S.regions.length ? '' : 'No region');
}
function renderAll() { if (!tabVisible(UI.tab)) { UI.tab = 'tutorial'; UI.sel = null; } renderNav(); renderList(); renderDetail(); renderTracker(); renderTrainer(); }

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
$('nav').addEventListener('click', function (e) {
  var t = e.target.closest('[data-tab]'); if (!t) return;
  UI.tab = t.getAttribute('data-tab'); UI.query = ''; $('search').value = ''; UI.sel = null; renderAll();
  $('listScroll').scrollTop = 0;
});
$('grid').addEventListener('click', function (e) {
  var c = e.target.closest('[data-q]'); if (!c) return;
  UI.sel = c.getAttribute('data-q'); renderList(); renderDetail();
});
$('detail').addEventListener('click', function (e) {
  var g = e.target.closest('[data-goto]');
  if (g) { var q = byId[g.getAttribute('data-goto')]; UI.tab = q.cat; UI.query = ''; $('search').value = ''; UI.sel = q.id; renderAll(); return; }
  var ch = e.target.closest('[data-choose]');
  if (ch) { act('accept', byId[ch.getAttribute('data-choose')]); return; }
  var a = e.target.closest('[data-act]');
  if (a && !a.disabled) act(a.getAttribute('data-act'), byId[UI.sel]);
});
$('search').addEventListener('input', function (e) { UI.query = e.target.value.trim().toLowerCase(); renderList(); });
$('search').addEventListener('keydown', function (e) { e.stopPropagation(); });
$('btnClose').onclick = function () { W.closeGui(); };

// ---------------------------------------------------------------------------
// Actions → messages on the `questdex` channel (see the bridge mod).
// ---------------------------------------------------------------------------
// The page never sends a command string. It names an action and a quest, and the QuestDex Bridge on the server turns that into
// the real /simplequests or /squest command (only these three are accepted). Nothing needs `trustedCommandOrigins`.
function send(msg) { msg.channel = 'questdex'; W.postToGame(msg); }
function act(kind, q) {
  if (kind === 'rules') { send({ kind: 'rules' }); return; }
  if (kind === 'accept' && q.id !== RULES_ID && rulesLocked()) { toast(RULES_MSG); return; }
  if (kind === 'accept') {
    var parent = q.parent && byId[q.parent];
    if (parent && parent.kind === 'composite') send({ kind: 'accept', id: parent.id, choice: q.id });   // pick one deal of a "choose one" quest
    else send({ kind: 'accept', id: q.id });
  } else if (kind === 'submit') send({ kind: 'submit' });
  else if (kind === 'track') send({ kind: 'track', id: q.id });
  if (!inMod) mockAct(kind, q);
}

// ---------------------------------------------------------------------------
// Server → page: full state snapshot. Shape documented in README.
// ---------------------------------------------------------------------------
W.on('quest_state', function (p) {
  var before = S.quests || {}, wasLive = S.live, wasTracked = S.tracked;
  S.live = true;
  S.trainer = p.trainer || S.trainer; S.regions = p.regions || []; S.tracked = p.tracked || null;
  S.counters = p.counters || {}; S.done = {}; (p.done || []).forEach(function (a) { S.done[a] = true; });
  S.quests = {}; Object.keys(p.quests || {}).forEach(function (id) {
    var x = p.quests[id]; S.quests[id] = { st: x.status, prog: x.progress || [], tasks: x.tasks || null, cd: x.cooldownEnds || 0 };
  });
  $('linkLed').style.opacity = 1; $('linkLed').title = 'Live';
  // The same "Quest Complete" line the server shows in the action bar (completion_effects.json), once per quest that just finished.
  if (wasLive) Object.keys(S.quests).forEach(function (id) {
    var was = before[id], now = S.quests[id], q = byId[id];
    if (q && !q.parent && was && was.st === 'in_progress' && now.st === 'completed') toast((DATA.doneText || '✦ Quest Complete: %quest_name% ✦').split('%quest_name%').join(q.name));
  });
  if (wasLive && S.tracked && S.tracked !== wasTracked && byId[S.tracked]) toast((DATA.trackedText || 'Tracking quest: %quest_name%').split('%quest_name%').join(byId[S.tracked].name));
  renderTrainer(); renderAll();
});
W.on('rules_notice', function (p) { if (p && p.text) toast(String(p.text)); });
W.on('client', function (c) { if (c && c.username && S.trainer === 'Trainer') { S.trainer = c.username; renderTrainer(); } });

var toastT;
function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2200); }

// ---------------------------------------------------------------------------
// MOCK SERVER (browser only). Simulates accept / progress / submit / cooldowns.
// ---------------------------------------------------------------------------
var fast = false;
function resetMock() {
  S = { trainer: 'Ash_Ketchum', regions: ['rootvale'], tracked: 'snobblemon:tutorial/10_berries', quests: {}, counters: {}, done: {}, live: false };
  var tut = Q.filter(function (q) { return q.cat === 'tutorial' && !q.parent; }).sort(function (a, b) { return a.sort - b.sort; });
  tut.slice(0, 9).forEach(function (q) { S.quests[q.id] = { st: 'completed', prog: q.objs.map(function (o) { return o.amount; }), cd: 0 }; });
  startQuest(tut[9]); S.quests[tut[9].id].prog[0] = Math.max(0, tut[9].objs[0].amount - 2);
  var tend = byId['snobblemon:rootvale/tend']; if (tend) { startQuest(tend); S.quests[tend.id].prog[0] = Math.floor(tend.objs[0].amount / 2); }
  var d1 = byId['snobblemon:journey/d01_daily_catch'];
  if (d1) { S.quests[d1.id] = { st: 'completed', prog: [d1.objs[0].amount], cd: now() + 9 * 3600e3 }; }
  renderAll();
}
function startQuest(q) {
  if (q.kind === 'single') S.quests[q.id] = { st: 'in_progress', prog: q.objs.map(function () { return 0; }), cd: 0 };
  else S.quests[q.id] = { st: 'in_progress', prog: [], cd: 0 };
}
function finish(q) {
  var cd = 0; if (q.repeat.kind === 'daily') cd = now() + 86400e3; else if (q.repeat.kind === 'cooldown') cd = now() + q.repeat.secs * 1000; else if (q.repeat.kind === 'repeat') cd = 1;
  S.quests[q.id] = { st: 'completed', prog: q.objs.map(function (o) { return o.amount; }), cd: cd };
}
function mockAct(kind, q) {
  if (kind === 'accept') {
    var parent = q.parent && byId[q.parent];
    if (parent) { startQuest(parent); startQuest(q); }
    else {
      startQuest(q);
      if (q.kind === 'sequential') startQuest(byId[q.subs[0]]);
    }
    toast('Quest accepted: ' + q.name);
  } else if (kind === 'track') {
    S.tracked = S.tracked === q.id ? null : q.id;
  } else if (kind === 'submit') {
    var sub = currentSub(q);
    if (q.kind === 'single') { finish(q); complete(q); }
    else if (q.kind === 'composite') { finish(sub); finish(q); complete(q); }
    else {
      finish(sub);
      var next = q.subs.filter(function (id) { return !st(id) || st(id).st !== 'completed'; })[0];
      if (next) { startQuest(byId[next]); toast('Step complete — next: ' + byId[next].name); }
      else { finish(q); complete(q); }
    }
  }
  renderAll();
}
function complete(q) { toast((DATA.doneText || '✦ Quest Complete: %quest_name% ✦').split('%quest_name%').join(q.name)); if (S.tracked === q.id) S.tracked = null; }
var tick = 0;
setInterval(function () {
  if (inMod) return;
  if (!fast && (++tick % 4)) return;
  var changed = false;
  Q.forEach(function (q) {
    var s = st(q.id);
    if (!s || s.st !== 'in_progress' || q.kind !== 'single') return;
    for (var i = 0; i < q.objs.length; i++) if ((s.prog[i] || 0) < q.objs[i].amount) { s.prog[i] = Math.min(q.objs[i].amount, (s.prog[i] || 0) + (fast ? Math.max(1, Math.ceil(q.objs[i].amount / 5)) : 1)); changed = true; break; }
  });
  if (changed) { renderList(); renderDetail(); renderTracker(); }
}, 400);

if (!inMod) {
  $('mockPanel').hidden = false; $('linkLed').style.opacity = .35;
  $('mockRegions').innerHTML = DATA.regions.map(function (r) { return '<label><input type="checkbox" data-r="' + r + '"' + (r === 'rootvale' ? ' checked' : '') + '> member of ' + cap(r) + '</label>'; }).join('');
  $('mockRegions').addEventListener('change', function () {
    S.regions = Array.prototype.map.call($('mockRegions').querySelectorAll('input:checked'), function (i) { return i.getAttribute('data-r'); }); renderAll();
  });
  $('mkSpeed').onclick = function () { fast = !fast; $('mkSpeed').textContent = 'Fast progress: ' + (fast ? 'on' : 'off'); };
  $('mkReset').onclick = function () { resetMock(); $('mockRegions').querySelectorAll('input').forEach(function (i) { i.checked = S.regions.indexOf(i.getAttribute('data-r')) !== -1; }); };
  UI.tab = 'tutorial'; resetMock();
  var first = Q.filter(function (q) { return q.cat === 'tutorial' && !q.parent && status(q) === 'in_progress'; })[0];
  if (first) { UI.sel = first.id; renderAll(); }
} else {
  UI.tab = 'tutorial'; $('linkLed').style.opacity = .35; $('linkLed').title = 'Waiting for the server...'; renderAll();
  // Tell the server this page is open (it answers with the full state), keep telling it so it keeps pushing changes, and say
  // goodbye on the way out: WebGUI gives the server no "page closed" event, so silence means closed.
  send({ kind: 'hello' });
  setInterval(function () { send({ kind: S.live ? 'ping' : 'hello' }); }, 4000);
  window.addEventListener('pagehide', function () { send({ kind: 'bye' }); });
}
// URL hash lets a reviewer jump straight to a tab (#journey, #rootvale/…), handy for screenshots.
if (location.hash.length > 1) {
  var hv = decodeURIComponent(location.hash.slice(1)).split('|');
  if (TABS.indexOf(hv[0]) !== -1) UI.tab = hv[0];
  if (hv[1] && byId[hv[1]]) UI.sel = hv[1];
  renderAll();
}
})();
</script>
</body>
